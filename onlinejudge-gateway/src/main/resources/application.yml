server:
  port: 8888
spring:
  application:
    name: onlinejudge-gateway
  redis:
    database: 2
    host: localhost
    port: 6379
    timeout: 5000
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-route
          uri: lb://onlinejudge-user-service
          predicates:
            - Path=/api/user/**
        - id: question-route
          uri: lb://onlinejudge-question-service
          predicates:
            - Path=/api/question/**
        - id: submit-route
          uri: lb://onlinejudge-submit-service
          predicates:
            - Path=/api/submit/**
jwt:
  secret: onlinejudge-jwt-secret-key-2026-256bits
  access-token-expire: 900
  refresh-token-expire: 604800
