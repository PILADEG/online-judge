server:
  port: 8888
spring:
  application:
    name: onlinejudge-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-route
          uri: lb://onlinejudge-user-service
          predicates:
            - Path=/api/user/**
        - id: question-route
          uri: lb://onlinejudge-question-service
          predicates:
            - Path=/api/question/**
        - id: submit-route
          uri: lb://onlinejudge-submit-service
          predicates:
            - Path=/api/submit/**
